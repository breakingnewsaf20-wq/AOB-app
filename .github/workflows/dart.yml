name: Build Afghan Online Bazaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml || { echo "ERROR: pubspec.yaml is missing"; exit 1; }
          test -f android/app/build.gradle -o -f android/app/build.gradle.kts || { echo "ERROR: Android Gradle file is missing"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Online-Bazaar-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
