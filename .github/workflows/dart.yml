name: Build Afghan Online Bazaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          test -s pubspec.yaml || (echo "ERROR: pubspec.yaml is missing or empty" && exit 1)
          test -d lib || (echo "ERROR: lib folder is missing" && exit 1)

      - name: Generate Android project files
        run: flutter create . --platforms=android

      - name: Get dependencies
        run: flutter pub get

      - name: Check Flutter code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Online-Bazaar-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
