workflows:
  android-debug-apk:
    name: Afghan Online Bazaar - Android Debug APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Verify Flutter project structure
        script: |
          test -d android || (echo "ERROR: android/ folder is missing" && exit 1)
          test -f android/app/google-services.json || (echo "ERROR: android/app/google-services.json is missing" && exit 1)
          flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Build Android debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release-apk:
    name: Afghan Online Bazaar - Android Release APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Android release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  android-release-aab:
    name: Afghan Online Bazaar - Android Release AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Android release bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
